<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chatbot</title>
    <style>
        body { font-family: Arial; margin: 50px; }
        #chatbox { border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: scroll; }
        #userInput { width: 80%; padding: 10px; }
        #sendBtn { padding: 10px; }
        .user { color: blue; }
        .bot { color: black; }
    </style>
</head>
<body>
    <h1>Chatbot Kopi</h1>
    <div id="chatbox"></div>
    <input type="text" id="userInput" placeholder="Tanya tentang kopi...">
    <button id="sendBtn">Kirim</button>

    <script>
        const chatbox = document.getElementById("chatbox");
        const input = document.getElementById("userInput");
        const btn = document.getElementById("sendBtn");

        btn.onclick = async () => {
            const question = input.value;
            if (!question) return;

            chatbox.innerHTML += `<p class="user"><b>You:</b> ${question}</p>`;
            input.value = "";

            const res = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question })
            });

            const data = await res.json();
            chatbox.innerHTML += `<p class="bot"><b>Bot:</b> ${data.answer}</p>`;
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    </script>
</body>
</html>
